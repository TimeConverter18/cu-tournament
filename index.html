<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5c64'/%3E%3Cpath d='M7 19.5l18-8.5-6.5 13.5-3.5-5.5z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>Решись Авиа</title>
    <meta
      name="description"
      content="Мобильный сервис динамического ценообразования авиабилетов и квантильного прогнозирования спроса."
    />
    <meta property="og:title" content="Решись Авиа" />
    <meta
      property="og:description"
      content="Мобильный сервис динамического ценообразования авиабилетов и квантильного прогнозирования спроса."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("reshis_avia_theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
